name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build with PyInstaller (onedir)
        shell: cmd
        run: |
          package.bat

      - name: Strip unused Qt6 modules
        shell: cmd
        run: |
          python cleanup_qt.py

      - name: Verify build output
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist/DeployTool -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "Build size: $('{0:N1}MB' -f ($size/1MB))"
          if (-not (Test-Path dist/DeployTool/DeployTool.exe)) {
            Write-Error "DeployTool.exe not found!"
            exit 1
          }

      - name: Zip onedir bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DeployTool -DestinationPath deploy-tool.zip -Force
          $zipSize = (Get-Item deploy-tool.zip).Length
          Write-Host "Zip size: $('{0:N1}MB' -f ($zipSize/1MB))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "部署工具 v${{ github.run_number }}"
          body: |
            Jar包一键部署工具，自动构建版本

            优化（v32+）：onefile → onedir，体积 102MB → ~87MB，启动 2.5s → 1.4s。
            解压 deploy-tool.zip 到任意目录，双击 DeployTool\DeployTool.exe 启动。
          draft: false
          prerelease: false
          files: |
            deploy-tool.zip
            dist/DeployTool/DeployTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
